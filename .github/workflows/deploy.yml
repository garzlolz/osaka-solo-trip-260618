name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # 當 main 分支有程式碼推送時自動觸發

# 設定工作流權限以允許部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 避免多個部署衝突
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        # 由於是 CI 環境，使用 frozen-lockfile 確保套件版本一致
        run: pnpm install --frozen-lockfile

      - name: Build Project
        run: pnpm run build

      - name: Copy Public Directory to Build Output
        # 將 public 目錄完整複製到 dist 中，確保 data.js 中的 public/images/... 靜態路徑可供讀取
        run: cp -R public dist/public

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
