<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2026 大阪獨旅 06/18 ~ 06/21</title>

    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#F4874B" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const base = window.location.pathname.endsWith('/') 
            ? window.location.pathname 
            : window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
          navigator.serviceWorker.register(`${base}sw.js`)
            .then(reg => console.log('SW registered!', reg))
            .catch(err => console.log('SW registration failed!', err));
        });
      }
    </script>

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              osk: {
                orange: "#F4874B",
                darkOrange: "#D96B28",
                amber: "#F7C948",
                cream: "#FFF3E8",
                navy: "#2C3E6B",
                teal: "#3AAFB9",
                green: "#5CB87A",
                red: "#E05555",
                sand: "#FDF5EC",
                purple: "#9B7ED9",
              },
            },
            fontFamily: {
              sans: ['"Noto Sans TC"', '"Microsoft JhengHei"', "sans-serif"],
            },
            boxShadow: {
              card: "4px 4px 0px 0px rgba(0,0,0,0.08)",
              "card-hover": "2px 2px 0px 0px rgba(0,0,0,0.08)",
            },
            animation: {
              "float-slow": "float 7s ease-in-out infinite",
              "float-medium": "float 5s ease-in-out infinite",
              "float-fast": "float 3.5s ease-in-out infinite",
              "spin-slow": "spin 18s linear infinite",
              "spin-reverse": "spin 22s linear infinite reverse",
            },
            keyframes: {
              float: {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-18px)" },
              },
            },
          },
        },
      };
    </script>

    <style>
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #FFE8D0; }
      ::-webkit-scrollbar-thumb { background: #F4874B; border-radius: 8px; }
      ::-webkit-scrollbar-thumb:hover { background: #D96B28; }

      body {
        background: linear-gradient(160deg, #FFF3E8 0%, #FFE5CC 60%, #FFDDB5 100%);
        color: #2C3E6B;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* 夜間模式全域樣式 */
      .dark body {
        background: linear-gradient(160deg, #0f172a 0%, #1e1b4b 60%, #311042 100%) !important;
        color: #f1f5f9 !important;
      }
      .dark ::-webkit-scrollbar-track { background: #1e293b; }
      .dark ::-webkit-scrollbar-thumb { background: #475569; }
      .dark ::-webkit-scrollbar-thumb:hover { background: #64748b; }

      /* Modal 動畫過渡 */
      .modal-enter-active, .modal-leave-active {
        transition: opacity 0.3s ease;
      }
      .modal-enter-active .modal-content, .modal-leave-active .modal-content {
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
      }
      .modal-enter-from, .modal-leave-to {
        opacity: 0;
      }
      .modal-enter-from .modal-content, .modal-leave-to .modal-content {
        transform: translateY(40px) scale(0.95);
        opacity: 0;
      }

      /* 地圖展開/收合動畫 */
      .map-fade-enter-active, .map-fade-leave-active {
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        max-height: 350px;
        opacity: 1;
        overflow: hidden;
      }
      .map-fade-enter-from, .map-fade-leave-to {
        max-height: 0;
        opacity: 0;
      }

      .animate-fade-in {
        animation: fadeIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(14px) scale(0.97); }
        to   { opacity: 1; transform: translateY(0)   scale(1);    }
      }

      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

      .bg-decor {
        position: fixed;
        z-index: 0;
        pointer-events: none;
        user-select: none;
        opacity: 0.18;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/js/main.js"></script>
  </body>
</html>
